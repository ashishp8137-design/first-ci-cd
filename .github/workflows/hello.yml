# This is workflow name
name: Hello
# Run on a trigger
on: 
  push:
    branches: [main]
# These are jobs inside the workflow
jobs:
# This is the name of job
  greet:
  # This is a github runner
    runs-on: ubuntu-latest
    steps:
      - name: say hello to users
        run: echo "Hello Dosto"
      - name: say hello to username
        run: echo "Hello $USER"
  details:
    runs-on: ubuntu-latest
    steps:
      - name: show what is the version of python,docker etc
        run: docker --version && python3 --version

  user_details:
    runs-on: ubuntu-latest
    steps:
      - name: say hello to users
        run: echo "Hello Dosto"
      - name: say hello to username
        run: echo "Hello $USER"
